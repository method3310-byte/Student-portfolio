<header class="site"><div class="container nav">

<div class="page-title"><div class="container"><h1>Contact me</h1></div></div>
<main><section><div class="container">
<form id="contactForm" class="contact" novalidate>
<div class="field"><label for="name">Name</label><input type="text" id="name" name="name"><span class="error" id="nameError"></span></div>
<div class="field"><label for="email">Email address</label><input type="email" id="email" name="email"><span class="error" id="emailError"></span></div>
<div class="field"><label for="phone">Phone number</label><input type="text" id="phone" name="phone" inputmode="numeric"><span class="error" id="phoneError"></span></div>
<div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><span class="error" id="messageError"></span></div>
<button class="btn" type="submit">Send message</button>
<div id="formStatus" aria-live="polite"></div>
</form></div></section></main><footer><div class="container"><p>&copy; 2026 Oparaocha Chidinma &middot; <a href="https://github.com/your-username/your-repo">GitHub repository</a></p></div></footer>
